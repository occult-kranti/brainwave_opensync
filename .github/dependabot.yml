version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        patterns: ['eslint*', 'typescript*', 'vite*', 'vitest*', '@vitest/*', 'happy-dom', 'tailwindcss*', 'postcss', 'autoprefixer', '@types/*', 'globals', 'esbuild']
        update-types: ['minor', 'patch']
      runtime:
        patterns: ['react*', 'framer-motion', 'lucide-react', 'cmdk', '@radix-ui/*', 'clsx', 'tailwind-merge']
        update-types: ['minor', 'patch']
    ignore:
      # Majors are reviewed by hand (ESLint 10, plugin-react 6 and friends break lint/build); minors and patches arrive grouped.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
