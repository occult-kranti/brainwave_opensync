name: Deploy to GitHub Pages

# Publishes the original master at / and the redesigned archive at /archive/.
# Existing /v2/, /previous/, /open-sync/ and /research/ remain available.
# Run this coordinator on master after updating the archive branch.
# Both source branches are published together to the `gh-pages`
# branch, which is the repository's Pages source ("Deploy from a branch").
# The gh-pages checkout is updated in place (not force-orphaned) so only the
# files that changed are pushed — the 108 MB of preview / stimulus WAVs are
# re-uploaded only when they change.
#
# If Pages is ever switched to the "GitHub Actions" source, replace the
# publish step with actions/upload-pages-artifact + actions/deploy-pages and
# allow `master` in the github-pages environment's deployment branch policy.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --reporter=dot
      - run: npm run build
        env:
          VITE_BASE: /brainwave_opensync/
      - name: Route shells (HTTP 200 deep links) + SPA 404 fallback
        run: node scripts/emit-route-shells.mjs dist
      - name: Install the preserved Open Sync suite
        working-directory: integrations/open-sync
        run: npm ci --no-audit --no-fund
      - name: Verify and prepare the original audio assets
        run: |
          node scripts/prepare-open-sync.mjs
          node integrations/open-sync/scripts/render-previews.mjs
      - name: Test and build the preserved suite
        working-directory: integrations/open-sync
        run: npm test -- --reporter=dot && VITE_BASE=/brainwave_opensync/open-sync/ npm run build
      - name: Include the preserved suite under open-sync
        run: |
          mkdir -p dist/open-sync
          cp -a integrations/open-sync/dist/. dist/open-sync/
          cp integrations/open-sync/LICENSE dist/open-sync/LICENSE
          cp integrations/open-sync/PROVENANCE.md dist/open-sync/PROVENANCE.md
      - name: Check out the previous release
        uses: actions/checkout@v7
        with:
          ref: legacy-v2.5
          path: legacy-source
      - name: Install previous-release dependencies
        working-directory: legacy-source
        run: npm ci --no-audit --no-fund
      - name: Verify and build the previous release
        working-directory: legacy-source
        run: npm run check && node scripts/emit-route-shells.mjs dist
        env:
          VITE_BASE: /brainwave_opensync/v2/
      - name: Include the previous release under v2
        run: |
          mkdir -p dist/v2
          cp -a legacy-source/dist/. dist/v2/
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const legacyCommit = execFileSync('git', ['-C', 'legacy-source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          writeFileSync('dist/deployments.json', JSON.stringify({
            current: { branch: 'master', commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sourceRelease: '78b0751', path: '/brainwave_opensync/' },
            previous: { branch: 'legacy-v2.5', commit: legacyCommit, path: '/brainwave_opensync/v2/' },
            originalSuite: { repository: 'occult-kranti/open-sync', commit: '02425613cd057406d92c4f3ee33b5fc54a493601', path: '/brainwave_opensync/open-sync/' },
            research: { path: '/brainwave_opensync/research/' },
          }, null, 2) + '\n');
          NODE
      - name: Check out the redesigned archive
        uses: actions/checkout@v7
        with:
          ref: archive/dark-landscapes
          path: archive-source
      - name: Verify and build the redesigned archive
        working-directory: archive-source
        run: |
          npm ci --no-audit --no-fund
          npm run check
          node scripts/emit-route-shells.mjs dist
        env:
          VITE_BASE: /brainwave_opensync/archive/
      - name: Include the redesigned archive
        run: |
          mkdir -p dist/archive
          cp -a archive-source/dist/. dist/archive/
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/deployments.json', 'utf8'));
          manifest.archive = {
            branch: 'archive/dark-landscapes',
            commit: execFileSync('git', ['-C', 'archive-source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            path: '/brainwave_opensync/archive/',
            themes: ['Night Country', 'Quiet Horizon']
          };
          writeFileSync('dist/deployments.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Check out the frozen listening room
        uses: actions/checkout@v7
        with:
          ref: archive/listening-room-2026-10-15
          path: listening-room-source
      - name: Build the archived listening room
        working-directory: listening-room-source
        run: |
          test "$(git rev-parse HEAD)" = ae4a1ebd6d1449979739edc9b5f84e2f09d39287
          npm ci --no-audit --no-fund
          npm run build
          node scripts/emit-route-shells.mjs dist
        env:
          VITE_BASE: /brainwave_opensync/previous/
      - name: Include the archived listening room under previous
        run: |
          mkdir -p dist/previous
          cp -a listening-room-source/dist/. dist/previous/
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/deployments.json', 'utf8'));
          manifest.listeningRoom = {
            branch: 'archive/listening-room-2026-10-15',
            commit: 'ae4a1ebd6d1449979739edc9b5f84e2f09d39287',
            path: '/brainwave_opensync/previous/'
          };
          writeFileSync('dist/deployments.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Build the connected research atlas and pinned source archives
        run: |
          node research-atlas/tests/independent-review.mjs
          node research-atlas/tests/independent-dom-review.mjs
          node research-atlas/tests/nanoparticles-ui.mjs
          python3 research-atlas/research/verify_rounds.py
          python3 research-atlas/research/nanoparticles/verify.py
          node research-atlas/sound-lab/test.mjs
          python3 research-atlas/scripts/verify_continuation.py
          python3 research-atlas/scripts/build_site.py --output dist/research
      - name: Preserve archived links to the connected projects
        run: node scripts/emit-archive-links.mjs dist
      - name: Publish dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --depth 1 --branch gh-pages "$REMOTE" site 2>/dev/null; then
            echo "updating existing gh-pages"
          else
            echo "creating gh-pages"
            mkdir site && git -C site init --quiet -b gh-pages && git -C site remote add origin "$REMOTE"
          fi
          rsync -a --delete --exclude .git dist/ site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed — site already up to date"
            exit 0
          fi
          git commit --quiet -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push --quiet origin gh-pages
          echo "published $(git rev-parse --short HEAD)"
