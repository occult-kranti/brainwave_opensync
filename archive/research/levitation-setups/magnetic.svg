<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="title description"><title id="title">Diamagnetic suspension: conceptual pole layout and force balance</title><desc id="description">Left: an alternating two-by-two pole arrangement under a possible sample footprint. Right: a separate side view shows a diamagnetic tile above magnets with upward magnetic force and downward weight. The depicted spacing is schematic; no magnetic field map or stable trap is calculated.</desc><rect width="840" height="520" fill="#0e1d24"/><style>text{font-family:Arial,sans-serif;fill:#dbe6e1;font-size:15px}.title{font-size:23px;fill:#f0d0ab}.small{font-size:12px;fill:#aebeb8}.label{font-size:14px}.copper{stroke:#e6ac7a;fill:none;stroke-width:2}.teal{stroke:#8bd0c6;fill:none;stroke-width:2}.line{stroke:#658b85;fill:none;stroke-width:1.5}.node{stroke:#80b9ad;stroke-dasharray:5 5;stroke-width:1.2}.part{fill:#233f42;stroke:#8cb5a7;stroke-width:1.5}.muted{fill:#182b31;stroke:#597771;stroke-width:1.5}.force{stroke:#e6ac7a;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#769a92;stroke-width:1.2}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e6ac7a"/></marker></defs>
<text x="30" y="38" class="title">Diamagnetic suspension · layout and force balance</text>
<text x="30" y="63" class="small">Conceptual geometry · not to scale · no field strength or assembly instructions</text>
