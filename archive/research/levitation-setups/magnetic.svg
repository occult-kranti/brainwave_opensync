<text x="89" y="361" class="small">Pole pattern is illustrative; tile anisotropy and the full field matter.</text>
<text x="30" y="409" class="label">Fz ≈ χV/(2μ₀) · ∂(B²)/∂z, for a weak isotropic linear material.</text>
<text x="30" y="436" class="small">Upward magnetic force can balance weight. Balance alone does not establish stability in three dimensions.</text>
<text x="30" y="472" class="small">Source context: Berry &amp; Geim (1997), and diamagnetic-source records in the laboratory dossier.</text>
<text x="30" y="496" class="small">Original explanatory SVG. This is a known magnetic force, not evidence that gravity is cancelled.</text></svg>