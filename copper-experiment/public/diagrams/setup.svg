<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 946" role="img" aria-labelledby="title desc"><title id="title">Copper-sphere A/B measurement bench</title><desc id="desc">A proposed two-metre table with sequential specimen stations A and B. One hollow sphere and the same three-point carrier move between stations. A co-moving laser Doppler vibrometer preserves beam geometry; a fixed head is a separate control. Calibrated excitation, a table accelerometer, temperature records and a shared-clock data acquisition system support comparison of fitted modes. The table and support are never assumed frictionless.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245c50"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:ui-monospace,monospace;letter-spacing:1px}</style><rect width="1280" height="946" fill="#faf8f2"/><text x="44" y="42" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">01 / PROPOSED MEASUREMENT BENCH</text><text x="44" y="86" font-size="35" fill="#202d2b" font-weight="600" text-anchor="start" class="">Move the specimen. Preserve the measurement.</text><text x="44" y="120" font-size="21" fill="#57615a" font-weight="400" text-anchor="start" class="">Top view · one sphere shown at two successive stations · schematic, not to scale</text><rect x="180" y="270" width="940" height="260" rx="0" fill="#eceee5" stroke="#245c50" stroke-width="2"/><text x="205" y="308" font-size="19" fill="#245c50" font-weight="600" text-anchor="start" class="mono">LEVEL TABLE  /  2 m illustrative length</text><line x1="180" y1="570" x2="1120" y2="570" stroke="#245c50" stroke-width="2"/><line x1="180" y1="560" x2="180" y2="580" stroke="#245c50" stroke-width="2"/><line x1="1120" y1="560" x2="1120" y2="580" stroke="#245c50" stroke-width="2"/><text x="650" y="605" font-size="21" fill="#57615a" font-weight="400" text-anchor="middle" class="">Record actual coordinates and table height at each station</text><circle cx="390" cy="420" r="62" fill="#f0e0d4" stroke="#a64d2d" stroke-width="3"/><circle cx="390" cy="420" r="55" fill="#faf8f2" stroke="#a64d2d" stroke-width="3"/><text x="390" y="430" font-size="30" fill="#a64d2d" font-weight="600" text-anchor="middle" class="">A</text><circle cx="348" cy="455" r="6" fill="#245c50" stroke="#245c50" stroke-width="3"/><circle cx="432" cy="455" r="6" fill="#245c50" stroke="#245c50" stroke-width="3"/><circle cx="390" cy="373" r="6" fill="#245c50" stroke="#245c50" stroke-width="3"/><rect x="310" y="490" width="160" height="18" rx="0" fill="#d9e4d8" stroke="#245c50" stroke-width="2"/><text x="390" y="551" font-size="19" fill="#245c50" font-weight="400" text-anchor="middle" class="">same carrier</text><circle cx="920" cy="420" r="62" fill="#faf8f2" stroke="#a64d2d" stroke-width="3" stroke-dasharray="8 6"/><circle cx="920" cy="420" r="55" fill="#faf8f2" stroke="#a64d2d" stroke-width="3" stroke-dasharray="8 6"/><text x="920" y="430" font-size="30" fill="#a64d2d" font-weight="600" text-anchor="middle" class="">B</text><circle cx="878" cy="455" r="6" fill="#245c50" stroke="#245c50" stroke-width="3"/><circle cx="962" cy="455" r="6" fill="#245c50" stroke="#245c50" stroke-width="3"/><circle cx="920" cy="373" r="6" fill="#245c50" stroke="#245c50" stroke-width="3"/><rect x="840" y="490" width="160" height="18" rx="0" fill="#d9e4d8" stroke="#245c50" stroke-width="2"/><text x="920" y="551" font-size="19" fill="#245c50" font-weight="400" text-anchor="middle" class="">same carrier</text><line x1="480" y1="420" x2="825" y2="420" stroke="#245c50" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="650" y="390" font-size="20" fill="#245c50" font-weight="400" text-anchor="middle" class="">translate between records</text><rect x="325" y="190" width="130" height="52" rx="0" fill="#d9e4d8" stroke="#245c50" stroke-width="2"/><text x="390" y="224" font-size="21" fill="#245c50" font-weight="600" text-anchor="middle" class="">LDV</text><line x1="390" y1="242" x2="390" y2="357" stroke="#a64d2d" stroke-width="2"/><rect x="855" y="190" width="130" height="52" rx="0" fill="#faf8f2" stroke="#245c50" stroke-width="2"/><text x="920" y="224" font-size="21" fill="#245c50" font-weight="600" text-anchor="middle" class="">LDV</text><line x1="920" y1="242" x2="920" y2="357" stroke="#a64d2d" stroke-width="2" stroke-dasharray="6 5"/><text x="650" y="185" font-size="21" fill="#245c50" font-weight="600" text-anchor="middle" class="">Co-moving LDV + fixture</text><text x="650" y="215" font-size="20" fill="#57615a" font-weight="400" text-anchor="middle" class="">same beam spot, angle and range</text><line x1="460" y1="255" x2="850" y2="255" stroke="#245c50" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="25" y="376" width="120" height="60" rx="0" fill="#e8e4d9" stroke="#202d2b" stroke-width="2"/><text x="85" y="401" font-size="19" fill="#202d2b" font-weight="600" text-anchor="middle" class="">Fixed LDV</text><text x="85" y="425" font-size="17" fill="#57615a" font-weight="400" text-anchor="middle" class="">control</text><line x1="145" y1="406" x2="328" y2="406" stroke="#a64d2d" stroke-width="2"/><text x="26" y="477" font-size="18" fill="#57615a" font-weight="400" text-anchor="start" class="">Re-aim at B;</text><text x="26" y="503" font-size="18" fill="#57615a" font-weight="400" text-anchor="start" class="">log geometry.</text><line x1="510" y1="460" x2="449" y2="443" stroke="#a64d2d" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="469" font-size="20" fill="#a64d2d" font-weight="600" text-anchor="start" class="">F(t)</text><rect x="650" y="465" width="45" height="30" rx="0" fill="#245c50" stroke="#245c50" stroke-width="2"/><text x="710" y="485" font-size="20" fill="#245c50" font-weight="400" text-anchor="start" class="">table a(t)</text><line x1="672" y1="495" x2="672" y2="530" stroke="#245c50" stroke-width="2"/><text x="1140" y="345" font-size="28" fill="#a64d2d" font-weight="600" text-anchor="start" class="">T</text><line x1="1150" y1="360" x2="1150" y2="450" stroke="#a64d2d" stroke-width="2"/><circle cx="1150" cy="465" r="13" fill="#f0e0d4" stroke="#a64d2d" stroke-width="3"/><text x="1110" y="512" font-size="18" fill="#57615a" font-weight="400" text-anchor="start" class="">Temperature</text><text x="1110" y="538" font-size="18" fill="#57615a" font-weight="400" text-anchor="start" class="">before / after</text><line x1="44" y1="640" x2="1236" y2="640" stroke="#d2d5ca" stroke-width="2"/><text x="44" y="681" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">ACQUISITION CHAIN</text><rect x="44" y="710" width="345" height="130" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="64" y="744" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Calibrated excitation F(t)</text><text x="64" y="776" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Measure the delivered input.</text><text x="64" y="808" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Verify energy in the test band.</text><rect x="445" y="710" width="345" height="130" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="465" y="744" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Synchronous DAQ + clock</text><text x="465" y="776" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Acquire F(t), v(t), table a(t).</text><text x="465" y="808" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Log T, geometry and settings.</text><rect x="846" y="710" width="390" height="130" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="866" y="744" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Frequency response + fits</text><text x="866" y="776" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Compare matched modal poles.</text><text x="866" y="808" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Keep amplitude, phase and errors.</text><line x1="393" y1="775" x2="438" y2="775" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><line x1="794" y1="775" x2="839" y2="775" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><text x="44" y="889" font-size="19" fill="#57615a" font-weight="400" text-anchor="start" class="">Separate runs: portable support / direct table contact / fixed-head control. Never combine their data as one boundary condition.</text><text x="44" y="920" font-size="19" fill="#57615a" font-weight="400" text-anchor="start" class="">LDV measures velocity along its beam. Soft support reduces coupling; it does not create a free or frictionless sphere.</text></svg>