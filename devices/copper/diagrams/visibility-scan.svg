<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1086" role="img" aria-labelledby="title desc"><title id="title">Mode visibility scan followed by orientation and translation controls</title><desc id="desc">At fixed station A, at least three readout locations S1, S2 and S3 measure a copper sphere, potentially using one scanning vibrometer sequentially. Two controlled excitation locations E1 and E2 are used in separate records. Schematic response curves illustrate different modal amplitudes at the same candidate poles and are not measured data. The next control rotates the specimen without translating it and includes handling-only repeats. A separate A-to-B test preserves portable support and relative source and sensor geometry. Complex responses are fit jointly with uncertainty; three readouts do not guarantee observation of all modes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245c50"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,monospace;letter-spacing:.6px}</style><rect width="1280" height="1086" fill="#faf8f2"/><text x="44" y="42" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">05 / MODE VISIBILITY AND MATCHING</text><text x="44" y="86" font-size="34" fill="#202d2b" font-weight="600" text-anchor="start">A missing peak can be a hidden measurement angle.</text><text x="44" y="121" font-size="21" fill="#57615a" font-weight="400" text-anchor="start">Proposed scan sequence · schematic curves show possibilities, not measured or fitted results</text><text x="44" y="171" font-size="19" fill="#245c50" font-weight="600" text-anchor="start" class="mono">1  KEEP STATION A FIXED</text><text x="44" y="201" font-size="21" fill="#57615a" font-weight="400" text-anchor="start">Scan ≥3 readout spots; excite sequentially at E1, then E2.</text><circle cx="370" cy="374" r="97" fill="#f0e0d4" stroke="#a64d2d" stroke-width="3"/><circle cx="370" cy="374" r="89" fill="#faf8f2" stroke="#a64d2d" stroke-width="3"/><text x="370" y="384" font-size="34" fill="#a64d2d" font-weight="600" text-anchor="middle">A</text><rect x="75" y="246" width="150" height="63" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="150" y="275" font-size="20" fill="#245c50" font-weight="600" text-anchor="middle">S1 · LDV</text><text x="150" y="298" font-size="17" fill="#57615a" font-weight="400" text-anchor="middle">readout</text><line x1="225" y1="290" x2="293" y2="313" stroke="#a64d2d" stroke-width="2"/><rect x="558" y="256" width="150" height="63" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="633" y="285" font-size="20" fill="#245c50" font-weight="600" text-anchor="middle">S2 · LDV</text><text x="633" y="308" font-size="17" fill="#57615a" font-weight="400" text-anchor="middle">readout</text><line x1="558" y1="305" x2="452" y2="321" stroke="#a64d2d" stroke-width="2"/><rect x="286" y="537" width="170" height="63" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="371" y="566" font-size="20" fill="#245c50" font-weight="600" text-anchor="middle">S3 · LDV</text><text x="371" y="589" font-size="17" fill="#57615a" font-weight="400" text-anchor="middle">readout</text><line x1="371" y1="537" x2="371" y2="471" stroke="#a64d2d" stroke-width="2"/><circle cx="307" cy="447" r="7" fill="#245c50" stroke="#245c50" stroke-width="3"/><circle cx="416" cy="289" r="7" fill="#245c50" stroke="#245c50" stroke-width="3"/><line x1="219" y1="482" x2="301" y2="451" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><text x="100" y="489" font-size="20" fill="#245c50" font-weight="600" text-anchor="start">E1 · input</text><line x1="478" y1="223" x2="422" y2="282" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><text x="489" y="232" font-size="20" fill="#245c50" font-weight="600" text-anchor="start">E2 · input</text><text x="44" y="644" font-size="21" fill="#57615a" font-weight="400" text-anchor="start">Hold support, temperature and specimen orientation fixed.</text><text x="44" y="674" font-size="21" fill="#57615a" font-weight="400" text-anchor="start">Return to the first geometry to check drift.</text><rect x="768" y="163" width="468" height="529" fill="#edf0e7" stroke="#d2d5ca" stroke-width="2"/><text x="791" y="202" font-size="17" fill="#245c50" font-weight="600" text-anchor="start" class="mono">DIFFERENT MODAL AMPLITUDES</text><text x="791" y="234" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">One candidate set of poles</text><text x="791" y="265" font-size="19" fill="#57615a" font-weight="400" text-anchor="start">can appear differently in each channel.</text><line x1="940" y1="301" x2="940" y2="590" stroke="#245c50" stroke-width="1.5" stroke-dasharray="4 7"/><line x1="1100" y1="301" x2="1100" y2="590" stroke="#245c50" stroke-width="1.5" stroke-dasharray="4 7"/><text x="791" y="358" font-size="20" fill="#245c50" font-weight="600" text-anchor="start">S1</text><line x1="827" y1="378" x2="1204" y2="378" stroke="#d2d5ca" stroke-width="2"/><path d="M 830,370.00 L 832,370.00 L 834,370.00 L 836,370.00 L 838,370.00 L 840,370.00 L 842,370.00 L 844,370.00 L 846,370.00 L 848,370.00 L 850,370.00 L 852,370.00 L 854,370.00 L 856,370.00 L 858,370.00 L 860,370.00 L 862,370.00 L 864,370.00 L 866,370.00 L 868,370.00 L 870,370.00 L 872,370.00 L 874,370.00 L 876,370.00 L 878,370.00 L 880,370.00 L 882,370.00 L 884,370.00 L 886,369.99 L 888,369.99 L 890,369.97 L 892,369.95 L 894,369.91 L 896,369.85 L 898,369.74 L 900,369.56 L 902,369.29 L 904,368.88 L 906,368.28 L 908,367.41 L 910,366.21 L 912,364.57 L 914,362.43 L 916,359.69 L 918,356.30 L 920,352.25 L 922,347.56 L 924,342.32 L 926,336.69 L 928,330.89 L 930,325.20 L 932,319.93 L 934,315.41 L 936,311.94 L 938,309.75 L 940,309.00 L 942,309.75 L 944,311.94 L 946,315.41 L 948,319.93 L 950,325.20 L 952,330.89 L 954,336.69 L 956,342.32 L 958,347.56 L 