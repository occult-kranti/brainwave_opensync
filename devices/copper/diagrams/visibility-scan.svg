6" y="867" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Check split modes, seams and anisotropy.</text><text x="66" y="896" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">A changed amplitude need not be a shifted pole.</text><rect x="662" y="729" width="574" height="188" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="684" y="769" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">3  TRANSLATE WITH MATCHED GEOMETRY</text><text x="684" y="809" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Move A → B with the same portable support.</text><text x="684" y="838" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Preserve source and readout spots and angles.</text><text x="684" y="867" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Randomize order; log thermal and clock drift.</text><text x="684" y="896" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Compare the same mode family with uncertainty.</text><rect x="44" y="947" width="1192" height="108" fill="#e8eee3" stroke="#245c50" stroke-width="2"/><text x="66" y="984" font-size="17" fill="#245c50" font-weight="600" text-anchor="start" class="mono">JOINT INFERENCE</text><text x="66" y="1020" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Fit complex responses together. Three readouts improve observability; they do not establish modal completeness.</text></svg>