<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1090" role="img" aria-labelledby="title desc"><title id="title">Force-referenced vibration measurement chain</title><desc id="desc">A calibrated source applies measured force to a loaded copper sphere. A laser Doppler vibrometer measures one surface-velocity projection. Separate force-reference and velocity voltages pass through calibrated analog anti-alias filters and enter a shared-clock synchronous analog-to-digital converter. Sample rate and record length define bin spacing. Calibrations, windows and Fourier or cross-spectral analysis produce a complex mobility in metres per second per newton. Repeated-channel pole fits report frequency, damping and uncertainty. Temperature, position, support and a calibrated table-acceleration channel are recorded separately. Usable sensor, source and filter bandwidth and the Nyquist limit must all be respected.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245c50"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,monospace;letter-spacing:.6px}</style><rect width="1280" height="1090" fill="#faf8f2"/><text x="44" y="42" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">04 / SIGNALS, UNITS AND BANDWIDTH</text><text x="44" y="86" font-size="35" fill="#202d2b" font-weight="600" text-anchor="start">Measure the input and the response together.</text><text x="44" y="121" font-size="21" fill="#57615a" font-weight="400" text-anchor="start">Proposed acquisition architecture · arrows show mechanical or recorded-signal paths</text><rect x="44" y="166" width="340" height="132" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="64" y="201" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">SOURCE + FORCE REFERENCE</text><text x="64" y="239" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Delivered force F(t) [N]</text><text x="64" y="269" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Exciter + force sensor calibrated</text><rect x="470" y="166" width="340" height="132" fill="#f0e0d4" stroke="#a64d2d" stroke-width="2"/><text x="490" y="201" font-size="18" fill="#a64d2d" font-weight="600" text-anchor="start" class="mono">LOADED COPPER SPHERE</text><text x="490" y="239" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Material, geometry, support</text><text x="490" y="269" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Surface motion v(t) [m/s]</text><rect x="896" y="166" width="340" height="132" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="916" y="201" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">VELOCITY LDV</text><text x="916" y="239" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">One beam projection of v(t)</text><text x="916" y="269" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Calibrated voltage Vᵥ(t) [V]</text><line x1="390" y1="230" x2="464" y2="230" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><text x="427" y="212" font-size="17" fill="#57615a" font-weight="400" text-anchor="middle">force</text><line x1="816" y1="230" x2="890" y2="230" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><text x="853" y="212" font-size="17" fill="#57615a" font-weight="400" text-anchor="middle">optical</text><line x1="214" y1="300" x2="214" y2="367" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><text x="230" y="338" font-size="19" fill="#245c50" font-weight="400" text-anchor="start">Vꜰ(t) [V]</text><line x1="1066" y1="300" x2="1066" y2="367" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><text x="1083" y="338" font-size="19" fill="#245c50" font-weight="400" text-anchor="start">Vᵥ(t) [V]</text><rect x="44" y="374" width="340" height="143" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="64" y="410" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">FORCE CHANNEL</text><text x="64" y="447" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Analog anti-alias filter</text><text x="64" y="479" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Known gain, delay and bandwidth</text><rect x="896" y="374" width="340" height="143" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="916" y="410" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">VELOCITY CHANNEL</text><text x="916" y="447" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Analog anti-alias filter</text><text x="916" y="479" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Known gain, delay and bandwidth</text><text x="640" y="400" font-size="21" fill="#202d2b" font-weight="600" text-anchor="middle">Metadata + reference channels</text><text x="640" y="435" font-size="20" fill="#57615a" font-weight="400" text-anchor="middle">T [K] · position [m] · support</text><text x="640" y="467" font-size="18" fill="#57615a" font-weight="400" text-anchor="middle">Table a(t) [m/s²] via its calibrated channel</text><path d="M 640 488 V 555" stroke="#245c50" fill="none" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/><path d="M 214 519 V 630 H 420" stroke="#245c50" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1066 519 V 630 H 860" stroke="#245c50" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="427" y="566" width="426" height="170" fill="#e8eee3" stroke="#245c50" stroke-width="2"/><text x="449" y="603" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">SYNCHRONOUS ADC / SHARED CLOCK</text><text x="449" y="641" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">fₛ [samples/s] · N samples per record</text><text x="449" y="673" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Digitize both voltages on the same clock</text><text x="449" y="705" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Trecord = N/fₛ  ·  Δfbin = fₛ/N</text><path d="M 640 738 V 775 H 339 V 809" stroke="#245c50" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="816" width="590" height="160" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="64" y="853" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">CALIBRATION → WINDOW → FFT / FRF</text><text x="64" y="891" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Convert to F[n] [N] and v[n] [m/s]</text><text x="64" y="922" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Complex mobility Hᵥꜰ(f): (m/s)/N</text><text x="64" y="953" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Keep phase, input spectrum and coherence γ²</text><rect x="706" y="816" width="530" height="160" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="726" y="853" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">MODE FIT + UNCERTAINTY</text><text x="726" y="891" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">fₙ [Hz] · damping ratio ζ [1]</text><text x="726" y="922" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Fit common poles across repeated channels</text><text x="726" y="953" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start">Account for noise, clock, fit and model error</text><line x1="641" y1="896" x2="699" y2="896" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><text x="44" y="1024" font-size="20" fill="#57615a" font-weight="400" text-anchor="start">Retained band B must lie below fₛ/2 with an anti-alias transition margin. Sensors and excitation may limit B further.</text><text x="44" y="1058" font-size="20" fill="#57615a" font-weight="400" text-anchor="start">FFT bin spacing is not frequency uncertainty. Zero-padding adds display points, not new measured information.</text></svg>