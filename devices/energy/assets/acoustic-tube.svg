<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#326451"/></marker></defs><g font-family="Arial, sans-serif" fill="#203e35"><text x="30" y="32" font-size="13" letter-spacing="2">B / ACOUSTIC CONTROL SURFACE</text><rect x="30" y="125" width="150" height="105" fill="#e2e7d8" stroke="#aab9a6"/><text x="47" y="157" font-size="17">Speaker + drive</text><text x="47" y="184" font-size="11">Supply power metered</text><text x="47" y="206" font-size="11">Separate system boundary</text><path d="M180 115H835V240H180" fill="#fbf9f3" stroke="#aab9a6" stroke-width="2"/><path d="M235 160H430" stroke="#326451" stroke-width="2" marker-end="url(#a)"/><path d="M540 206H340" stroke="#a74e2d" stroke-width="2" marker-end="url(#a)"/><text x="280" y="146" font-size="12">Incident wave</text><text x="380" y="225" font-size="12" fill="#a74e2d">Reflected wave</text><rect x="626" y="120" width="58" height="115" fill="#e2e7d8" stroke="#326451"/><text x="601" y="273" font-size="13">Receiver / transducer</text><text x="706" y="175" font-size="11">Transmitted path</text><text x="706" y="195" font-size="11">if two-port fixture</text><path d="M330 115V75M510 115V75" stroke="#326451" stroke-width="2"/><circle cx="330" cy="72" r="7" fill="#a74e2d"/><circle cx="510" cy="72" r="7" fill="#a74e2d"/><text x="300" y="56" font-size="11">Pressure 1</text><text x="479" y="56" font-size="11">Pressure 2</text><text x="266" y="306" font-size="12">Calibrated spacing + matched gain/phase → wave separation</text><path d="M658 120V80H937V125" fill="none" stroke="#326451" stroke-width="2"/><rect x="870" y="125" width="192" height="105" fill="#e2e7d8" stroke="#aab9a6"/><text x="886" y="157" font-size="17">Measured load</text><text x="886" y="184" font-size="11">Voltage × current / resistor</text><text x="886" y="206" font-size="11">DC storage is a separate test</text><text x="30" y="351" font-size="11" fill="#657169">Phase-resolved flux, not a pressure-only near-field estimate. Include structure-borne vibration, leaks, uncertainty and calibration.</text></g></svg>
