<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">Why measured spectra can vary with position</title><desc id="desc">Five analysis layers: specimen properties, support and table boundary conditions, environmental path, receiver geometry and calibration, and spectral inference. Each layer has a corresponding control. The schematic explains why a changed recorded peak does not uniquely imply a changed intrinsic mode or an absolute location frequency.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245c50"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:ui-monospace,monospace;letter-spacing:1px}</style><rect width="1280" height="900" fill="#faf8f2"/><text x="44" y="42" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">02 / WHAT A SPECTRUM CONTAINS</text><text x="44" y="86" font-size="35" fill="#202d2b" font-weight="600" text-anchor="start" class="">A shifted peak has more than one explanation.</text><text x="44" y="121" font-size="21" fill="#57615a" font-weight="400" text-anchor="start" class="">The detector records a channel of a coupled system, within a finite bandwidth.</text><rect x="44" y="158" width="1192" height="88" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="63" y="192" font-size="20" fill="#a64d2d" font-weight="600" text-anchor="start" class="mono">01</text><text x="112" y="192" font-size="20" fill="#a64d2d" font-weight="600" text-anchor="start" class="mono">SPECIMEN</text><text x="112" y="222" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Material · shape · temperature · stress</text><text x="675" y="193" font-size="16" fill="#a64d2d" font-weight="600" text-anchor="start" class="mono">CONTROL</text><text x="675" y="223" font-size="20" fill="#57615a" font-weight="400" text-anchor="start" class="">Same sphere, orientation and thermal history</text><line x1="640" y1="247" x2="640" y2="262" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="265" width="1192" height="88" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="63" y="299" font-size="20" fill="#245c50" font-weight="600" text-anchor="start" class="mono">02</text><text x="112" y="299" font-size="20" fill="#245c50" font-weight="600" text-anchor="start" class="mono">BOUNDARY</text><text x="112" y="329" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Support · contact force · table modes</text><text x="675" y="300" font-size="16" fill="#245c50" font-weight="600" text-anchor="start" class="mono">CONTROL</text><text x="675" y="330" font-size="20" fill="#57615a" font-weight="400" text-anchor="start" class="">Carry the same support; test bare contact separately</text><line x1="640" y1="354" x2="640" y2="369" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="372" width="1192" height="88" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="63" y="406" font-size="20" fill="#245c50" font-weight="600" text-anchor="start" class="mono">03</text><text x="112" y="406" font-size="20" fill="#245c50" font-weight="600" text-anchor="start" class="mono">PATH</text><text x="112" y="436" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Air · room reflections · external fields</text><text x="675" y="407" font-size="16" fill="#245c50" font-weight="600" text-anchor="start" class="mono">CONTROL</text><text x="675" y="437" font-size="20" fill="#57615a" font-weight="400" text-anchor="start" class="">Co-move geometry; record environment and reference</text><line x1="640" y1="461" x2="640" y2="476" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="479" width="1192" height="88" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="63" y="513" font-size="20" fill="#245c50" font-weight="600" text-anchor="start" class="mono">04</text><text x="112" y="513" font-size="20" fill="#245c50" font-weight="600" text-anchor="start" class="mono">RECEIVER</text><text x="112" y="543" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Beam direction · gain · clock · noise</text><text x="675" y="514" font-size="16" fill="#245c50" font-weight="600" text-anchor="start" class="mono">CONTROL</text><text x="675" y="544" font-size="20" fill="#57615a" font-weight="400" text-anchor="start" class="">Calibrate; repeat with fixed and co-moving sensors</text><line x1="640" y1="568" x2="640" y2="583" stroke="#245c50" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="586" width="1192" height="88" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="63" y="620" font-size="20" fill="#202d2b" font-weight="600" text-anchor="start" class="mono">05</text><text x="112" y="620" font-size="20" fill="#202d2b" font-weight="600" text-anchor="start" class="mono">INFERENCE</text><text x="112" y="650" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Input spectrum · window · fit · mode label</text><text x="675" y="621" font-size="16" fill="#202d2b" font-weight="600" text-anchor="start" class="mono">CONTROL</text><text x="675" y="651" font-size="20" fill="#57615a" font-weight="400" text-anchor="start" class="">Compare fitted poles with uncertainty, not tallest bins</text><rect x="44" y="718" width="1192" height="154" rx="0" fill="#e8eee3" stroke="#245c50" stroke-width="2"/><text x="65" y="752" font-size="17" fill="#245c50" font-weight="600" text-anchor="start" class="mono">READOUT MODEL</text><text x="65" y="790" font-size="27" fill="#202d2b" font-weight="500" text-anchor="start" class="">measured response = receiver × coupled dynamics × excitation + noise</text><text x="65" y="828" font-size="21" fill="#57615a" font-weight="400" text-anchor="start" class="">A microphone adds room propagation. An LDV measures a surface velocity projection.</text><text x="65" y="856" font-size="21" fill="#57615a" font-weight="400" text-anchor="start" class="">There is no instrument channel called the “entire frequency” of an object or a point.</text></svg>