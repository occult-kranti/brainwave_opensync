<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 796" role="img" aria-labelledby="title desc"><title id="title">Independent controlled motion experiment</title><desc id="desc">A proposed top-view table with a copper sphere at A and target B. An overhead camera records position versus time. The drive direction, level and airflow are controlled. Randomized sham, target-frequency and detuned conditions, apparatus reversal and blinded destination labels help distinguish ordinary forces and drift from a claimed destination-specific effect. This is not a depiction of an observed result.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245c50"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:ui-monospace,monospace;letter-spacing:1px}</style><rect width="1280" height="796" fill="#faf8f2"/><text x="44" y="42" font-size="18" fill="#245c50" font-weight="600" text-anchor="start" class="mono">03 / A SEPARATE MOTION TEST</text><text x="44" y="86" font-size="34" fill="#202d2b" font-weight="600" text-anchor="start" class="">Does a driven sphere move toward a chosen station?</text><text x="44" y="121" font-size="21" fill="#57615a" font-weight="400" text-anchor="start" class="">Proposed test only. A vibration-frequency match does not specify a force or a destination.</text><rect x="80" y="260" width="1120" height="210" rx="0" fill="#eceee5" stroke="#245c50" stroke-width="2"/><text x="103" y="298" font-size="19" fill="#245c50" font-weight="600" text-anchor="start" class="mono">TOP VIEW / MARKED TRACK</text><circle cx="300" cy="370" r="44" fill="#f0e0d4" stroke="#a64d2d" stroke-width="3"/><text x="300" y="379" font-size="26" fill="#a64d2d" font-weight="600" text-anchor="middle" class="">A</text><circle cx="980" cy="370" r="44" fill="#faf8f2" stroke="#245c50" stroke-width="3" stroke-dasharray="6 6"/><text x="980" y="379" font-size="26" fill="#245c50" font-weight="600" text-anchor="middle" class="">B</text><line x1="380" y1="370" x2="890" y2="370" stroke="#245c50" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="640" y="340" font-size="20" fill="#245c50" font-weight="400" text-anchor="middle" class="">Track x(t), velocity, drift and stopping position</text><rect x="545" y="160" width="190" height="62" rx="0" fill="#faf8f2" stroke="#245c50" stroke-width="2"/><text x="640" y="185" font-size="18" fill="#245c50" font-weight="600" text-anchor="middle" class="">OVERHEAD CAMERA</text><text x="640" y="209" font-size="16" fill="#57615a" font-weight="400" text-anchor="middle" class="">calibrated scale + clock</text><line x1="640" y1="222" x2="640" y2="260" stroke="#245c50" stroke-width="2" stroke-dasharray="4 5"/><rect x="25" y="332" width="90" height="78" rx="0" fill="#faf8f2" stroke="#202d2b" stroke-width="2"/><text x="70" y="359" font-size="19" fill="#202d2b" font-weight="600" text-anchor="middle" class="">drive</text><text x="70" y="386" font-size="19" fill="#202d2b" font-weight="600" text-anchor="middle" class="">source</text><line x1="118" y1="370" x2="250" y2="370" stroke="#a64d2d" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/><text x="80" y="507" font-size="21" fill="#57615a" font-weight="400" text-anchor="start" class="">Check level with a calibrated inclinometer; use an airflow enclosure and log source direction.</text><rect x="44" y="552" width="378" height="132" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="62" y="584" font-size="17" fill="#245c50" font-weight="600" text-anchor="start" class="mono">SHAM + DETUNED</text><text x="62" y="622" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Randomize drive off / target /</text><text x="62" y="652" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">detuned at matched input level.</text><rect x="451" y="552" width="378" height="132" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="469" y="584" font-size="17" fill="#245c50" font-weight="600" text-anchor="start" class="mono">REVERSE THE APPARATUS</text><text x="469" y="622" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Reverse source direction and</text><text x="469" y="652" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">rotate the table relative to room.</text><rect x="858" y="552" width="378" height="132" rx="0" fill="#faf8f2" stroke="#d2d5ca" stroke-width="2"/><text x="876" y="584" font-size="17" fill="#245c50" font-weight="600" text-anchor="start" class="mono">BLIND THE DESTINATION</text><text x="876" y="622" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Predefine A/B target labels.</text><text x="876" y="652" font-size="21" fill="#202d2b" font-weight="400" text-anchor="start" class="">Judge tracked motion blind.</text><text x="44" y="730" font-size="20" fill="#57615a" font-weight="400" text-anchor="start" class="">Ordinary alternatives: residual slope, airflow, acoustic force, contact vibration, electromagnetic force and handling.</text><text x="44" y="764" font-size="20" fill="#57615a" font-weight="400" text-anchor="start" class="">Keep this test separate from modal measurements. No motion result has been collected for this project.</text></svg>